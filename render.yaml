# Render (https://render.com) lee este archivo al conectar el repositorio de GitHub
# ("New +" → "Blueprint"). Crea la página con un link público https://<nombre>.onrender.com
# y la vuelve a publicar sola cada vez que subes cambios a GitHub.
services:
  - type: web
    name: criptoanalisis
    runtime: docker
    plan: free
    autoDeploy: true
    # Liviano: no llama a APIs externas (index.php sí, y gastaba cupo de CoinGecko en cada chequeo).
    healthCheckPath: /api/salud.php
    envVars:
      # Contraseña para crear el primer administrador: Render inventa una segura
      # (la ves en el panel de Render → Environment).
      - key: ADMIN_PASSWORD
        generateValue: true
      # Estas las pegas tú en el panel de Render → Environment (déjalas vacías si no las usas).
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: COINGECKO_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Código de Google Search Console (Etiqueta HTML) para aparecer en Google (README.md, paso 6).
      - key: GOOGLE_SITE_VERIFICATION
        sync: false
      # Base de datos PostgreSQL gratuita (Supabase, ver README.md). En el plan gratis de Render
      # el disco se borra en cada publicación: con esta variable las cuentas, el progreso y los
      # ajustes se guardan en Supabase y no se pierden. Sin ella se usa un archivo SQLite temporal.
      - key: DATABASE_URL
        sync: false
      # Solo cuando la página ya esté detrás de Cloudflare con dominio propio (ver config/config.php):
      # el mismo valor que pone la regla de Cloudflare en la cabecera X-Origen-Secreto.
      - key: ORIGEN_SECRETO
        sync: false
      # Captcha de Cloudflare Turnstile en "Crear cuenta" (gratis, funciona con …onrender.com).
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET
        sync: false
